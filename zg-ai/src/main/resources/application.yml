server:
  port: 8086
spring:
  application:
    name: ai-service
  # zg-ai 无数据库，但 zg-common 传递引入了 mybatis-plus starter，需排除 JDBC 自动配置
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 2
  ai:
    zhipuai:
      # 智谱 API Key，用环境变量注入：ZHIPUAI_API_KEY，不要把 key 提交到代码里
      api-key: ${ZHIPUAI_API_KEY:}
      embedding:
        options:
          # 显式指定 embedding-3（2048 维）。不指定会落到默认 embedding-2（1024 维），
          # 与下方 embedding-dimension=2048 的集合维度不匹配，向量写入全部失败
          model: embedding-3
    vectorstore:
      milvus:
        client:
          host: ${MILVUS_HOST:localhost}
          port: 19530
        database-name: zg_mall
        # GLM embedding-3 输出维度，与 embedding 模型保持一致
        embedding-dimension: 2048
        initialize-schema: true
zg:
  jwt:
    secret: ${JWT_SECRET:zgmall-jwt-secret-placeholder-32bytes-min}
    ttl: 1800000
logging:
  level:
    com.zgmall: debug
