server:
  port: 8081
spring:
  application:
    name: user-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/zg_user?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis-plus:
  global-config:
    db-config:
      id-type: assign_id
      update-strategy: not_null
  configuration:
    map-underscore-to-camel-case: true
zg:
  jwt:
    secret: ${JWT_SECRET:zgmall-jwt-secret-placeholder-32bytes-min}
    ttl: 1800000
logging:
  level:
    com.zgmall: debug
